    />
    <title>交付助理 · 项目交付 AI</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #f5f6f8;
        color: #1a1d21;
        font-family: PingFang SC, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-splash {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .boot-splash-mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #2563eb;
        display: grid;
        place-items: center;
        box-shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-splash-name {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0;
      }
      .boot-splash-hint {
        margin-top: -10px;
        color: #5a6069;
        font-size: 13px;
      }
      .boot-splash-bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: #e3e5e9;
        overflow: hidden;
      }
      .boot-splash-bar > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #2563eb;
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.94); opacity: 0.82; }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-mark,
        .boot-splash-bar > span { animation: none; }
      }
    </style>
